<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="googled0d342fb49f0d234" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#881337" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VGrade" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VGrade</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="VIT GPA and CGPA Calculator for VIT Vellore students. Calculate GPA, CGPA, grade points and course improvement impact easily."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="
      VIT GPA Calculator,
      VIT CGPA Calculator,
      VIT Vellore GPA Calculator,
      VIT CGPA,
      Nithesh Kumar T,
      Nithesh VIT,
      VITian Calculator,
      VGrade vit,
      "
    />

    <!-- Author -->
    <meta name="author" content="Nithesh Kumar T" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="VIT GPA Calculator | VIT CGPA Calculator" />
    <meta
      property="og:description"
      content="A GPA and CGPA calculator designed specifically for VIT Vellore students."
    />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />

    <!-- Google Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "VIT GPA Calculator",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "author": {
        "@type": "Person",
        "name": "Nithesh Kumar T"
      },
      "description": "A GPA and CGPA calculator designed for VIT Vellore students."
    }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered', reg))
            .catch(err => console.error('Service Worker registration failed', err));
        });
      }

      // Capture beforeinstallprompt for React components to invoke cleanly
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      window.addEventListener('appinstalled', () => {
        console.log('VGrade PWA installed successfully!');
        window.deferredPrompt = null;
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
